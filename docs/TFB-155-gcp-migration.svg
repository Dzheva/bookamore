<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1480" viewBox="0 0 1680 1480" font-family="DejaVu Sans, Segoe UI, Roboto, sans-serif">
<rect width="1680" height="1480" fill="#FFFFFF"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1976D2"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607D8B"/></marker></defs>
<text x="48" y="60" font-size="30" font-weight="700" fill="#1A237E">Міграція Bookamore на GCP e2-micro за Cloudflare Tunnel</text>
<text x="48" y="92" font-size="17" fill="#546E7A">Два обмеження визначають усе інше: 1 GB RAM (збірка переїжджає в CI) і 1 GB вихідного трафіку на місяць (статику кешує Cloudflare).</text>
<text x="48" y="116" font-size="15" fill="#546E7A">TFB-155 · PROD на GCP за www.bookamore.store · DEV і старий PROD лишаються на VPS у зоні alt-web.biz.ua</text>
<text x="48" y="164" font-size="16" font-weight="700" fill="#1A237E">Конвеєр доставки</text>
<text x="308" y="164" font-size="14" fill="#546E7A">збірка більше не відбувається на сервері</text>
<rect x="48" y="178" width="370" height="66" rx="10" fill="#BBDEFB" stroke="#1976D2" stroke-width="2"/>
<text x="233" y="206" font-size="16" font-weight="700" fill="#0D2B45" text-anchor="middle">git push → main</text>
<text x="233" y="228" font-size="12.5" fill="#0D2B45" opacity="0.78" text-anchor="middle">гілка main у GitHub</text>
<line x1="424" y1="211" x2="446" y2="211" stroke="#607D8B" stroke-width="2.4" marker-end="url(#ahg)"/>
<rect x="452" y="178" width="370" height="66" rx="10" fill="#ECEFF1" stroke="#607D8B" stroke-width="2"/>
<text x="637" y="206" font-size="16" font-weight="700" fill="#263238" text-anchor="middle">GitHub Actions</text>
<text x="637" y="228" font-size="12.5" fill="#263238" opacity="0.78" text-anchor="middle">job build-images: Maven + npm</text>
<line x1="828" y1="211" x2="850" y2="211" stroke="#607D8B" stroke-width="2.4" marker-end="url(#ahg)"/>
<rect x="856" y="178" width="370" height="66" rx="10" fill="#ECEFF1" stroke="#607D8B" stroke-width="2"/>
<text x="1041" y="206" font-size="16" font-weight="700" fill="#263238" text-anchor="middle">GHCR</text>
<text x="1041" y="228" font-size="12.5" fill="#263238" opacity="0.78" text-anchor="middle">ghcr.io/dzheva/bookamore-*:sha</text>
<line x1="1232" y1="211" x2="1254" y2="211" stroke="#607D8B" stroke-width="2.4" marker-end="url(#ahg)"/>
<rect x="1260" y="178" width="370" height="66" rx="10" fill="#BBDEFB" stroke="#1976D2" stroke-width="2"/>
<text x="1445" y="206" font-size="16" font-weight="700" fill="#0D2B45" text-anchor="middle">GCP e2-micro</text>
<text x="1445" y="228" font-size="12.5" fill="#0D2B45" opacity="0.78" text-anchor="middle">docker compose pull &amp;&amp; up -d</text>
<text x="48" y="308" font-size="16" font-weight="700" fill="#1A237E">Шлях запиту в рантаймі</text>
<text x="308" y="308" font-size="14" fill="#546E7A">тунель ініціюється зсередини VM — вхідних портів немає</text>
<rect x="48" y="322" width="235" height="66" rx="10" fill="#ECEFF1" stroke="#607D8B" stroke-width="2"/>
<text x="165" y="350" font-size="16" font-weight="700" fill="#263238" text-anchor="middle">Користувач</text>
<text x="165" y="372" font-size="12.5" fill="#263238" opacity="0.78" text-anchor="middle">www.bookamore.store</text>
<line x1="289" y1="355" x2="311" y2="355" stroke="#607D8B" stroke-width="2.4" marker-end="url(#ahg)"/>
<rect x="317" y="322" width="235" height="66" rx="10" fill="#ECEFF1" stroke="#607D8B" stroke-width="2"/>
<text x="434" y="350" font-size="16" font-weight="700" fill="#263238" text-anchor="middle">Cloudflare edge</text>
<text x="434" y="372" font-size="12.5" fill="#263238" opacity="0.78" text-anchor="middle">TLS + кеш статики</text>
<line x1="558" y1="355" x2="580" y2="355" stroke="#607D8B" stroke-width="2.4" marker-end="url(#ahg)"/>
<rect x="586" y="322" width="235" height="66" rx="10" fill="#BBDEFB" stroke="#1976D2" stroke-width="2"/>
<text x="703" y="350" font-size="16" font-weight="700" fill="#0D2B45" text-anchor="middle">cloudflared</text>
<text x="703" y="372" font-size="12.5" fill="#0D2B45" opacity="0.78" text-anchor="middle">контейнер, вихідний тунель</text>
<line x1="827" y1="355" x2="849" y2="355" stroke="#607D8B" stroke-width="2.4" marker-end="url(#ahg)"/>
<rect x="855" y="322" width="235" height="66" rx="10" fill="#BBDEFB" stroke="#1976D2" stroke-width="2"/>
<text x="972" y="350" font-size="16" font-weight="700" fill="#0D2B45" text-anchor="middle">frontend · nginx</text>
<text x="972" y="372" font-size="12.5" fill="#0D2B45" opacity="0.78" text-anchor="middle">порт 80, лише в docker-мережі</text>
<line x1="1096" y1="355" x2="1118" y2="355" stroke="#607D8B" stroke-width="2.4" marker-end="url(#ahg)"/>
<rect x="1124" y="322" width="235" height="66" rx="10" fill="#BBDEFB" stroke="#1976D2" stroke-width="2"/>
<text x="1241" y="350" font-size="16" font-weight="700" fill="#0D2B45" text-anchor="middle">backend · Spring</text>
<text x="1241" y="372" font-size="12.5" fill="#0D2B45" opacity="0.78" text-anchor="middle">порт 8080</text>
<line x1="1365" y1="355" x2="1387" y2="355" stroke="#607D8B" stroke-width="2.4" marker-end="url(#ahg)"/>
<rect x="1393" y="322" width="235" height="66" rx="10" fill="#BBDEFB" stroke="#1976D2" stroke-width="2"/>
<text x="1510" y="350" font-size="16" font-weight="700" fill="#0D2B45" text-anchor="middle">db · Postgres 16</text>
<text x="1510" y="372" font-size="12.5" fill="#0D2B45" opacity="0.78" text-anchor="middle">порт 5432</text>
<text x="48" y="436" font-size="16" font-weight="700" fill="#1A237E">Порядок виконання</text>
<rect x="48" y="454" width="1584" height="96" rx="10" fill="#FAFBFC" stroke="#CFD8DC" stroke-width="1.6"/>
<rect x="48" y="454" width="6" height="96" rx="3" fill="#1976D2"/>
<circle cx="98" cy="502" r="20" fill="#1A237E"/>
<text x="98" y="509" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="140" y="487" font-size="18" font-weight="700" fill="#1A237E">Створити VM у межах Always Free</text>
<text x="140" y="512" font-size="14" fill="#546E7A">e2-micro · us-east1-b · pd-standard 30 GB · network tier STANDARD. Інший тип диска або регіон робить машину платною;</text>
<text x="140" y="533" font-size="14" fill="#546E7A">зони перебираються до вільної.</text>
<rect x="1240" y="482" width="372" height="40" rx="8" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1.6"/>
<text x="1426" y="507" font-size="13.5" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#1B5E20" text-anchor="middle">gcloud compute instances create</text>
<rect x="48" y="563" width="1584" height="96" rx="10" fill="#FAFBFC" stroke="#CFD8DC" stroke-width="1.6"/>
<rect x="48" y="563" width="6" height="96" rx="3" fill="#1976D2"/>
<circle cx="98" cy="611" r="20" fill="#1A237E"/>
<text x="98" y="618" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="140" y="596" font-size="18" font-weight="700" fill="#1A237E">Підготувати систему під 1 GB</text>
<text x="140" y="621" font-size="14" fill="#546E7A">Swap-файл 1 GB і vm.swappiness=10 як подушка на піки, Docker, каталог /opt/bookamore, .env з правами 600.</text>
<rect x="1240" y="591" width="372" height="40" rx="8" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1.6"/>
<text x="1426" y="616" font-size="13.5" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#1B5E20" text-anchor="middle">deploy/gcp/env.example</text>
<rect x="48" y="672" width="1584" height="96" rx="10" fill="#FAFBFC" stroke="#CFD8DC" stroke-width="1.6"/>
<rect x="48" y="672" width="6" height="96" rx="3" fill="#1976D2"/>
<circle cx="98" cy="720" r="20" fill="#1A237E"/>
<text x="98" y="727" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="140" y="705" font-size="18" font-weight="700" fill="#1A237E">Винести збірку образів у CI</text>
<text x="140" y="730" font-size="14" fill="#546E7A">Maven і npm build не влазять у 1 GB — образи збирає GitHub Actions і кладе в GHCR тегами :latest і :sha. VM робить</text>
<text x="140" y="751" font-size="14" fill="#546E7A">лише pull.</text>
<rect x="1240" y="700" width="372" height="40" rx="8" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1.6"/>
<text x="1426" y="725" font-size="13.5" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#1B5E20" text-anchor="middle">.github/workflows/deploy.yml</text>
<rect x="48" y="781" width="1584" height="96" rx="10" fill="#FAFBFC" stroke="#CFD8DC" stroke-width="1.6"/>
<rect x="48" y="781" width="6" height="96" rx="3" fill="#1976D2"/>
<circle cx="98" cy="829" r="20" fill="#1A237E"/>
<text x="98" y="836" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="140" y="814" font-size="18" font-weight="700" fill="#1A237E">Ужати рантайм під ліміт памʼяті</text>
<text x="140" y="839" font-size="14" fill="#546E7A">JVM: -Xmx256m -Xss256k, SerialGC, ExitOnOutOfMemoryError. Postgres: shared_buffers=48MB, без паралельних воркерів.</text>
<text x="140" y="860" font-size="14" fill="#546E7A">Іменовані томи для БД і фото.</text>
<rect x="1240" y="809" width="372" height="40" rx="8" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1.6"/>
<text x="1426" y="834" font-size="13.5" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#1B5E20" text-anchor="middle">docker-compose.gcp.yaml</text>
<rect x="48" y="890" width="1584" height="96" rx="10" fill="#FAFBFC" stroke="#CFD8DC" stroke-width="1.6"/>
<rect x="48" y="890" width="6" height="96" rx="3" fill="#1976D2"/>
<circle cx="98" cy="938" r="20" fill="#1A237E"/>
<text x="98" y="945" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="140" y="923" font-size="18" font-weight="700" fill="#1A237E">Полагодити X-Forwarded-Proto</text>
<text x="140" y="948" font-size="14" fill="#546E7A">За тунелем nginx бачить лише http, тож Spring будував redirect_uri з http:// — провайдер такий колбек відхиляє. Схему</text>
<text x="140" y="969" font-size="14" fill="#546E7A">тепер беремо з вхідного заголовка через map.</text>
<rect x="1240" y="918" width="372" height="40" rx="8" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1.6"/>
<text x="1426" y="943" font-size="13.5" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#1B5E20" text-anchor="middle">frontend/nginx.conf</text>
<rect x="48" y="999" width="1584" height="96" rx="10" fill="#FAFBFC" stroke="#CFD8DC" stroke-width="1.6"/>
<rect x="48" y="999" width="6" height="96" rx="3" fill="#1976D2"/>
<circle cx="98" cy="1047" r="20" fill="#1A237E"/>
<text x="98" y="1054" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="140" y="1032" font-size="18" font-weight="700" fill="#1A237E">Підняти Cloudflare Tunnel</text>
<text x="140" y="1057" font-size="14" fill="#546E7A">Токен коннектора в .env, Public Hostname → frontend:80 по docker-мережі. На хості не публікується жоден порт, прямий</text>
<text x="140" y="1078" font-size="14" fill="#546E7A">вхід по IP закритий.</text>
<rect x="1240" y="1027" width="372" height="40" rx="8" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1.6"/>
<text x="1426" y="1052" font-size="13.5" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#1B5E20" text-anchor="middle">cloudflared у compose</text>
<rect x="48" y="1108" width="1584" height="96" rx="10" fill="#FAFBFC" stroke="#CFD8DC" stroke-width="1.6"/>
<rect x="48" y="1108" width="6" height="96" rx="3" fill="#1976D2"/>
<circle cx="98" cy="1156" r="20" fill="#1A237E"/>
<text x="98" y="1163" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="140" y="1141" font-size="18" font-weight="700" fill="#1A237E">Завести власний домен у Cloudflare</text>
<text x="140" y="1166" font-size="14" fill="#546E7A">У Cloudflare їде чиста зона bookamore.store, а не alt-web.biz.ua з поштою і чужими сайтами. Канонічний хост www, апекс</text>
<text x="140" y="1187" font-size="14" fill="#546E7A">віддає 301 на нього. Universal SSL + Always Use HTTPS.</text>
<rect x="1240" y="1136" width="372" height="40" rx="8" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1.6"/>
<text x="1426" y="1161" font-size="13.5" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#1B5E20" text-anchor="middle">Cloudflare Dashboard</text>
<rect x="48" y="1217" width="1584" height="96" rx="10" fill="#FAFBFC" stroke="#CFD8DC" stroke-width="1.6"/>
<rect x="48" y="1217" width="6" height="96" rx="3" fill="#1976D2"/>
<circle cx="98" cy="1265" r="20" fill="#1A237E"/>
<text x="98" y="1272" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
<text x="140" y="1250" font-size="18" font-weight="700" fill="#1A237E">Перенести дані та закрити периметр</text>
<text x="140" y="1275" font-size="14" fill="#546E7A">pg_dump / pg_restore, uploads розпаковуються в named volume. Видалити firewall-правила http/https, поставити budget</text>
<text x="140" y="1296" font-size="14" fill="#546E7A">alert на $1.</text>
<rect x="1240" y="1245" width="372" height="40" rx="8" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1.6"/>
<text x="1426" y="1270" font-size="13.5" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#1B5E20" text-anchor="middle">deploy/gcp/README.md §6, §9</text>
<rect x="48" y="1342" width="1584" height="92" rx="10" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/>
<text x="72" y="1370" font-size="16" font-weight="700" fill="#1A237E">Що перевіряти після запуску</text>
<text x="72" y="1396" font-size="14" fill="#546E7A">docker stats — сума RSS нижче ~800 MB · апекс віддає 301 на www зі збереженим шляхом · cf-cache-status: HIT на /assets/ і /img/</text>
<text x="72" y="1419" font-size="14" fill="#546E7A">прямий запит на публічний IP не відповідає · Billing → Reports через добу показує нуль · фото і БД лишаються на місці після docker compose down</text>
</svg>