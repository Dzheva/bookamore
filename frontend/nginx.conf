# TLS тут не термінується. У GCP-схемі перед цим nginx стоїть Cloudflare Tunnel,
# тому $scheme завжди "http" — реальну схему клієнта знає лише вхідний X-Forwarded-Proto.
# Без цієї map Spring зібрав би redirect_uri з http://, і Google відхилив би OAuth2-колбек.
map $http_x_forwarded_proto $forwarded_proto {
    default     $scheme;
    "~^https?$" $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 21M;

    # Стискаємо на origin: ділянка cloudflared → Cloudflare edge рахується як вихідний
    # трафік GCP (ліміт 1 GB/міс), і саме її обсяг визначає, скільки ми зʼїмо.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml application/manifest+json;

    # Імена файлів містять хеш вмісту, тож довгий TTL безпечний — Cloudflare
    # кешує зображення на edge і перестає смикати origin (менше egress з GCP).
    location /img/ {
        alias /usr/share/nginx/html/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # API and Swagger requests go to backend
    location ~ ^/(api/v1|swagger-ui|v3/api-docs)(/|$) {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
    }

    # OAuth2 endpoints go to backend
    location ~ ^/(login/)?oauth2/ {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
    }

    # SPA fallback for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
